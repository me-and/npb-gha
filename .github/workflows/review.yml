name: npb review
run-name: 'npb review #${{ inputs.pr }}'

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

jobs:
  review:
    name: Run npb
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Recover runner disk space
        uses: wimpysworld/nothing-but-nix@v10

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: NixOS/nixpkgs

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Instantiate npb
        id: instantiate-npb
        run: |
          drv="$(nix eval --raw --apply 'builtins.getAttr "drvPath"' github:samestep/npb)"
          printf 'drv=%s\n' "$drv" >>"$GITHUB_OUTPUT"
          output="$(nix-store --query --outputs "$drv")"
          printf 'output=%s\n' "$output" >>"$GITHUB_OUTPUT"

      - name: Restore npb cache
        id: cache-npb
        uses: actions/cache@v6
        with:
          path: npb.cache
          key: ${{ steps.instantiate-npb.outputs.drv }}

      - name: Unpack cached npb
        if: steps.cache-npb.outputs.cache-hit == 'true'
        run: |
          nix-store --import <npb.cache
          rm npb.cache

      - name: Build npb
        env:
          DRV: ${{ steps.instantiate-npb.outputs.drv }}
        run: nix-store --realise "$DRV" --add-root npb

      - name: Run npb
        env:
          INPUT_PR: ${{ inputs.pr }}
        run: ./npb/bin/npb --pr "$INPUT_PR" | tee report.md

      - name: Upload npb report
        uses: actions/upload-artifact@v7
        with:
          name: npb-${{ inputs.pr }}-${{ matrix.system }}.md
          path: report.md
          if-no-files-found: error
          overwrite: true
          archive: false

      - name: Cache npb
        if: always() && steps.cache-npb.outputs.cache-hit != 'true'
        run: nix-store --query requisites npb | xargs nix-store --export >npb.cache
